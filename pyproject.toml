[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-user-enhanced"
version = "0.1.0"
description = "A Django module for easy authentication pages with login, registration, password reset, and more"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "AGPL-3.0"}
authors = [
    {name = "Connor Hess"}
]
keywords = ["django", "authentication", "login", "register", "password-reset", "user-management"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 3.2",
    "Framework :: Django :: 4.0",
    "Framework :: Django :: 4.1",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    "Django>=3.2",
]

[project.urls]
Homepage = "https://github.com/connorhess/Django-User-Enhanced"
Repository = "https://github.com/connorhess/Django-User-Enhanced"
Issues = "https://github.com/connorhess/Django-User-Enhanced/issues"

[tool.setuptools.packages.find]
include = ["django_user_enhanced*"]

[tool.setuptools.package-data]
django_user_enhanced = ["templates/**/*", "static/**/*"]
