{% extends "django_user_enhanced/base.html" %}

{% block title %}Password Reset Complete - Django User Enhanced{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1>Password Reset Complete</h1>
        <p>Your password has been successfully reset. You can now log in with your new password.</p>
        
        <div class="auth-links">
            <p><a href="{% url 'django_user_enhanced:login' %}">Go to Login</a></p>
        </div>
    </div>
</div>
{% endblock %}
