{% extends "django_user_enhanced/base.html" %}

{% block title %}Password Reset Email Sent - Django User Enhanced{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1>Password Reset Email Sent</h1>
        <p>We've sent you an email with instructions to reset your password. Please check your inbox.</p>
        
        <div class="auth-links">
            <p><a href="{% url 'django_user_enhanced:login' %}">Back to Login</a></p>
        </div>
    </div>
</div>
{% endblock %}
